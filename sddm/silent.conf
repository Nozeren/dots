; SilentSDDM login screen, Everforest (hard) with the Streetlights wallpaper.
; Based on the theme's configs/everforest.conf. install.sh copies it to
; /usr/share/sddm/themes/silent/configs/default.conf.user: SDDM applies a ".user"
; file on top of the theme's config, and package updates never touch it.

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "streetlights.png"
use-background-color = false
background-color = "#272e33"
blur = 0
brightness = 0.0
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "center"
align = "center"
format = "hh:mm"
font-family = "RedHatDisplay"
font-size = 70
font-weight = 900
color = "#d3c6aa"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "RedHatDisplay"
font-size = 14
font-weight = 600
color = "#d3c6aa"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "RedHatDisplay"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#d3c6aa"
paint-icon = true
spacing = 0

[LoginScreen]
background = "streetlights.png"
use-background-color = false
background-color = "#272e33"
blur = 20
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#a7c080"
inactive-border-color = "#a7c080"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "RedHatDisplay"
font-size = 16
font-weight = 700
color = "#d3c6aa"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = false
font-family = "RedHatDisplay"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#d3c6aa"
background-color = "#2e383c"
background-opacity = 1.0
border-size = 0
border-color = "#a7c080"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#2e383c"
background-opacity = 1.0
active-background-color = "#a7c080"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#a7c080"
active-content-color = "#272e33"
border-size = 0
border-color = "#a7c080"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "RedHatDisplay"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "RedHatDisplay"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#d3c6aa"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "RedHatDisplay"
font-size = 11
font-weight = 400
normal-color = "#d3c6aa"
warning-color = "#dbbc7f"
error-color = "#e67e80"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 100
margin-left = 0
size = 30
border-radius = 10
spacing = 20
font-family = "RedHatDisplay"

[LoginScreen.MenuArea.Popups]
max-height = 230
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = false
margin = 5
background-color = "#2e383c"
background-opacity = 1.0
active-option-background-color = "#374145"
active-option-background-opacity = 1.0
content-color = "#d3c6aa"
active-content-color = "#a7c080"
font-family = "RedHatDisplay"
border-size = 0
border-color = "#a7c080"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = false
button-width = -1
popup-width = 200
background-color = "#a7c080"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#d3c6aa"
active-content-color = "#272e33"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = false
background-color = "#a7c080"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#d3c6aa"
active-content-color = "#272e33"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = false
position = "bottom-center"
index = 0
background-color = "#a7c080"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#d3c6aa"
active-content-color = "#272e33"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#a7c080"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#d3c6aa"
active-content-color = "#272e33"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#2e383c"
background-opacity = 0.15
key-content-color = "#d3c6aa"
key-color = "#2e383c"
key-opacity = 1.0
key-active-background-color = "#374145"
key-active-opacity = 1.0
selection-background-color = "#d3c6aa"
selection-content-color = "#272e33"
primary-color = "#a7c080"
border-size = 0
border-color = "#a7c080"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "RedHatDisplay"
font-size = 11
content-color = "#d3c6aa"
background-color = "#2e383c"
background-opacity = 1.0
border-radius = 10
disable-user = false
disable-login-button = false
