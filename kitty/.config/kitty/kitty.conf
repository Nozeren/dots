# ~/.config/kitty/kitty.conf

include everforest-dark-hard.conf

# Per-OS settings (font size, Mac keys): linux.conf or macos.conf
include ${KITTY_OS}.conf

# ---------------------------------------------------------------- font

font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# ---------------------------------------------------------------- behaviour

enable_audio_bell no
confirm_os_window_close 0
editor nvim

# Selecting text copies it to the clipboard
copy_on_select clipboard

# Links: Ctrl+click opens them, also inside tmux (which otherwise takes the mouse);
# a plain click never opens a link. Hovering a link shows where it goes.
detect_urls yes
show_hyperlink_targets yes
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed,ungrabbed discard_event
