# hyprpaper 0.8+ (https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/)
# Everforest "streetlights" (github.com/Apeiros-46B/everforest-walls), from the dotfiles wallpapers/ package

wallpaper {
    monitor =                   # empty: every monitor
    path = ~/.local/share/wallpapers/streetlights.png
    fit_mode = cover
}

splash = true                   # Hyprland splash text over the wallpaper
