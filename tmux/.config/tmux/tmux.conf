# ~/.config/tmux/tmux.conf

# ---------------------------------------------------------------- basics

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,*256col*:RGB"    # true colour
set -sg escape-time 10          # Esc reaches Neovim straight away
set -g focus-events on          # lets Neovim notice when it gains focus
set -g mouse on
set -g history-limit 50000

# Number windows and panes from 1 (matches the keyboard), close gaps when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim keys in copy mode and in tmux's own prompt (prefix + :)
setw -g mode-keys vi
set -g status-keys vi

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ---------------------------------------------------------------- windows and panes

# New splits and windows start in the current pane's folder
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Ctrl+h/j/k/l moves between panes, and between Neovim splits as if they were panes:
# in a pane running Neovim the keys go to Neovim, which hands back to tmux at its edge
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l          # Ctrl+l is taken, so prefix + Ctrl+l clears the screen

# prefix + h/j/k/l also moves; prefix + H/J/K/L resizes (hold to repeat)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# prefix + f: fuzzy-pick any session or window
bind f display-popup -E -w 60% -h 50% \
    "t=\$(tmux list-windows -a -F '#S:#I  #W' | fzf --reverse --prompt 'window> ' | cut -d' ' -f1); [ -n \"\$t\" ] && tmux switch-client -t \"\$t\""

# ---------------------------------------------------------------- copy mode

set -s set-clipboard on         # copy to the system clipboard via the terminal (works on Linux and macOS)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind P paste-buffer

# ---------------------------------------------------------------- look (Everforest hard)
#
#  dots ◤ 20:28 ◤ M: 21%          nvim     zsh          C: 9.2% ◢ Fri ◢ hades
#  └ session: green, orange while the prefix is pressed                          host ┘

set -g status-position top
set -g status-justify centre
set -g status-interval 2
set -g status-style "fg=#859289,bg=default"
set -g status-left-length 60
set -g status-right-length 60

set -g status-left "\
#{?client_prefix,#[bg=#e69875],#[bg=#a7c080]}#[fg=#272e33] #S \
#{?client_prefix,#[fg=#e69875],#[fg=#a7c080]}#[bg=#495156]\
#[fg=#859289,bg=#495156] %H:%M #[fg=#495156,bg=default]\
#[fg=#d699b6] M: #[fg=#dbbc7f]#(~/.config/tmux/scripts/stats.sh mem) "

set -g status-right "\
#[fg=#d699b6] C: #[fg=#dbbc7f]#(~/.config/tmux/scripts/stats.sh cpu) \
#[fg=#495156,bg=default]#[fg=#859289,bg=#495156] %a \
#[fg=#a7c080,bg=#495156]#[fg=#272e33,bg=#a7c080] #H "

# Windows: app icon (from the program running in the window) + name, current one in a flat block
set -g @win_icon "#{?#{==:#{pane_current_command},nvim},,#{?#{==:#{pane_current_command},vim},,#{?#{==:#{pane_current_command},zsh},,#{?#{==:#{pane_current_command},bash},,#{?#{==:#{pane_current_command},fish},,#{?#{==:#{pane_current_command},python},,#{?#{==:#{pane_current_command},python3},,#{?#{==:#{pane_current_command},node},,#{?#{==:#{pane_current_command},claude},󰚩,#{?#{==:#{pane_current_command},ssh},󰣀,#{?#{==:#{pane_current_command},git},,#{?#{==:#{pane_current_command},lazygit},,#{?#{==:#{pane_current_command},docker},,#{?#{==:#{pane_current_command},htop},,#{?#{==:#{pane_current_command},btop},,}}}}}}}}}}}}}}}"
set -g window-status-separator ""
setw -g window-status-format "#[fg=#859289,bg=default]  #{E:@win_icon}  #W  "
setw -g window-status-current-format "#[fg=#d3c6aa,bg=#495156,bold]  #{E:@win_icon}  #W  "
setw -g window-status-activity-style "fg=#dbbc7f,bg=default"
setw -g window-status-bell-style "fg=#e67e80,bg=default"

set -g pane-border-style "fg=#414b50"
set -g pane-active-border-style "fg=#a7c080"
set -g message-style "fg=#d3c6aa,bg=#374145"
set -g message-command-style "fg=#d3c6aa,bg=#374145"
setw -g mode-style "fg=#d3c6aa,bg=#4c3743"
setw -g clock-mode-colour "#a7c080"
set -g display-panes-active-colour "#a7c080"
set -g display-panes-colour "#859289"

# ---------------------------------------------------------------- plugins

# Kept out of ~/.config/tmux (which is linked into the dotfiles repo)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"     # prefix + Ctrl+s saves, prefix + Ctrl+r restores
set -g @plugin "tmux-plugins/tmux-continuum"     # saves every 15 minutes, restores when tmux starts
set -g @continuum-restore "on"

# Install TPM and the plugins on first start
if-shell "test ! -d ~/.local/share/tmux/plugins/tpm" \
    "run-shell 'git clone -q https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"
run "~/.local/share/tmux/plugins/tpm/tpm"

# Machine-specific bindings and startup commands, kept out of this repo (gitignored):
# every file in ~/.config/tmux/local
source-file -q ~/.config/tmux/local/*.conf
